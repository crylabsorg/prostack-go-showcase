# yaml-language-server: $schema=https://www.schemastore.org/traefik-v3.json

api: {}

log:
  level: INFO

accessLog: {}

tracing:
  otlp:
    grpc:
      endpoint: jaeger:4317
      insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
  websecure:
    address: ":443"

providers:
  file:
    filename: /etc/traefik/dynamic_conf.yml
