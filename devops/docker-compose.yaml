name: prostack-go-showcase
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
  redis:
    image: redis:8.10.2-alpine3.23
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  nats:
    image: nats:2.14.6-alpine3.22
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data
    restart: unless-stopped
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686" # web ui
      - "4317:4317" # grpc
      - "4318:4318" # http
    restart: unless-stopped
  mongo:
    image: mongo:8.3.11
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_data:/data/configdb
    command:
      [
        "/bin/sh",
        "-c",
        'mongod --replSet my-replica-set --bind_ip_all & sleep 5 && mongosh --eval ''try { rs.initiate({_id:"my-replica-set",members:[{_id:0,host:"localhost:27017"}]}) } catch(e) { print(e) }'' && wait',
      ]
    restart: unless-stopped
  traefik:
    image: traefik:v3.7.5
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml
      - ./dynamic_conf.yml:/etc/traefik/dynamic_conf.yml
      - ./certs:/etc/traefik/certs
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  nats_data:
  mongo_data:
